[package]
name = "gcamview"
version = "0.1.0"
edition = "2024"

[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
gio = "0.21"
glib = "0.21"

gstreamer = "0.24"
gstreamer-video = "0.24"

rumqttc = "0.24"